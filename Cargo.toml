# Features and dependencies are derived from the pinned upstream Cargo.toml.
[package]
name = "msquic-src"
version = "2.5.8"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "The unmodified MsQuic Rust crate and native sources, pinned to an upstream release."
repository = "https://github.com/DEKHTIARJonathan/msquic-src"
readme = "README.md"
build = "build.rs"
keywords = ["msquic", "quic", "native"]
categories = ["network-programming"]
include = ["/src", "/build.rs", "/msquic", "/README.md", "/LICENSE.md"]

[features]
default = ["src"]
# Build c code from source
src = [ "dep:cmake" ]
# Find prebuilt msquic. Use vcpkg installed location on Windows,
# while use system installed location on linux.
# MacOs is not supported.
find = []
# Windows uses schannel, and linux uses quictls by default.
# This feature enables quictls on windows, and has no effect on linux.
quictls = []
static = []
preview-api = []
# Overwrite generated binding by reruning the bindgen
overwrite = [ "dep:bindgen" ]

[build-dependencies]
cmake = { version = "0.1", optional = true }
bindgen = { version = "0.71", optional = true }
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4", default-features = false }

[dependencies]
bitflags = "2.9"
libc = "0.2"
c-types = "4.0"
ctor = "0.4"
socket2 = "0.5"

[workspace]
exclude = ["msquic", "testcrate", "target"]
