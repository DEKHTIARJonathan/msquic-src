---
name: CI
"on":
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.1
        with:
          version: "1.26.1"
      - name: Install pinned cargo-audit
        shell: bash
        run: cargo binstall --locked --no-confirm cargo-audit@0.22.2
      - name: Install prek and restore hook environments
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.5"
          install-only: true
      - name: Prepare prek hook environments
        shell: bash
        run: prek prepare-hooks
      - name: Run prek
        shell: bash
        run: prek run --show-diff-on-failure --color=always --all-files
      - run: make check-version
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path testcrate/Cargo.toml --check
      - name: Select MsQuic feature modes
        id: matrix
        shell: python
        run: |
          import json
          import os
          import tomllib
          from pathlib import Path

          features = tomllib.loads(Path("Cargo.toml").read_text())["features"]
          modes = [
              "default",
              "src,quictls,static",
              "src,quictls,static,preview-api,overwrite",
          ]
          if "openssl" in features:
              modes += ["src,openssl", "src,openssl,static"]
          targets = {
              "ubuntu-latest": "x86_64-unknown-linux-gnu",
              "macos-latest": "aarch64-apple-darwin",
              "windows-latest": "x86_64-pc-windows-msvc",
          }
          cases = [
              {"os": os_name, "target": target, "features": mode}
              for os_name, target in targets.items()
              for mode in modes
          ]
          cases += [
              {
                  "os": "windows-latest",
                  "target": targets["windows-latest"],
                  "features": mode,
              }
              for mode in ["src,static", "src,quictls"]
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": cases}) + "\n")
  package:
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Initialize pinned native dependencies
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          upstream_version=${version%%-*}
          tag="refs/tags/v$upstream_version"
          git -C msquic fetch --depth 1 origin "$tag:$tag"
          paths=(submodules/quictls submodules/xdp-for-windows)
          if [ -n "$(git -C msquic ls-tree HEAD -- submodules/openssl)" ]; then
            paths+=(submodules/openssl)
          fi
          git -C msquic submodule update --init --depth 1 -- "${paths[@]}"
      - name: Package and enforce the 10 MB limit
        run: make package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate
          path: |
            dist/*.crate
            target/package-src/
            !target/package-src/target/**
          if-no-files-found: error

  smoke-tests:
    name: MsQuic smoke tests (${{ matrix.os }}, ${{ matrix.features }})
    needs: [pre-commit, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pre-commit.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          clang_version="$(clang -dumpversion)"
          sudo apt-get "${apt_options[@]}" install -y \
            libnuma-dev "libclang1-${clang_version%%.*}"
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          msquic_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          printf 'SDKROOT=%s\n' "$msquic_sdk" >> "$GITHUB_ENV"
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - name: Configure parallel Windows builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jom = Join-Path $env:RUNNER_TEMP 'jom'
          $zip = "$jom.zip"
          $url = 'https://download.qt.io/official_releases/jom/jom_1_1_7.zip'
          Invoke-WebRequest $url -OutFile $zip
          $expected = '4c8af345586a9a08fbfd2f613fcac7482' +
            '26d91a75627aa3581b297dd513046fe'
          $hash = Get-FileHash $zip -Algorithm SHA256
          $actual = $hash.Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw 'JOM archive checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $jom
          $perl = 'C:\Strawberry\perl\bin'
          & "$perl\perl.exe" -MLocale::Maketext::Simple `
            -MExtUtils::MakeMaker -e 'print qq(ok)'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows Perl is required' }
          @($jom, $perl, 'C:\Program Files\NASM') | Add-Content $env:GITHUB_PATH
          $shortRoot = Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) 'm'
          $toolchain = Join-Path $env:GITHUB_WORKSPACE `
            '.github/cmake/windows.cmake'
          @(
            'CMAKE_GENERATOR=Ninja'
            "CMAKE_BUILD_PARALLEL_LEVEL=$env:NUMBER_OF_PROCESSORS"
            "MSQUIC_TEST_ROOT=$shortRoot"
            "CMAKE_TOOLCHAIN_FILE=$toolchain"
            'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
            'PYTHONUTF8=1'
          ) | Add-Content $env:GITHUB_ENV
          & ninja --version
          & "$jom\jom.exe" /version
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
      - name: Prepare packaged MsQuic smoke tests
        env:
          FEATURES: ${{ matrix.features }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import tarfile
          import tomllib
          import uuid

          work = (
              Path(
                  os.environ.get(
                      "MSQUIC_TEST_ROOT", os.environ["RUNNER_TEMP"]
                  )
              )
              / uuid.uuid4().hex[:12]
          )
          work.mkdir(parents=True)
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"][
              "version"
          ]
          with tarfile.open(
              Path("dist") / f"msquic-src-{version}.crate"
          ) as archive:
              archive.extractall(work, filter="data")
          crate = next(work.glob("msquic-src-*"))
          project = work / "smoke"
          shutil.copytree(
              "testcrate",
              project,
              ignore=shutil.ignore_patterns("target", "Cargo.lock"),
          )
          dependency = "{ path = " + json.dumps(str(crate))
          mode = os.environ["FEATURES"]
          if mode != "default":
              dependency += (
                  ", default-features = false, features = "
                  + json.dumps(mode.split(","))
              )
          dependency += " }"
          manifest = project / "Cargo.toml"
          manifest.write_text(
              re.sub(
                  r"(?m)^msquic-src = .*",
                  lambda _: "msquic-src = " + dependency,
                  manifest.read_text(),
              )
          )
          version = tomllib.loads((crate / "Cargo.toml").read_text())[
              "package"
          ]["version"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in {
                  "TEST_MANIFEST": manifest,
                  "CARGO_TARGET_DIR": work / "t",
                  "MSQUIC_INCLUDE_DIR": crate / "msquic/src/inc",
                  "MSQUIC_EXPECTED_VERSION": version.split("-")[0],
                  "MSQUIC_TEST_WINDOWS_STATIC": int(
                      "static" in mode.split(",")
                  ),
              }.items():
                  output.write(f"{key}={value}\n")
      - name: Build MsQuic and smoke tests
        shell: python
        run: |
          import os
          import subprocess

          subprocess.run(
              [
                  "cargo",
                  "test",
                  "--manifest-path",
                  os.environ["TEST_MANIFEST"],
                  "--target",
                  "${{ matrix.target }}",
                  "--no-run",
              ],
              check=True,
          )
      - name: Run API, version, handshake, and stream echo tests
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          if os.name == "nt":
              directories = sorted(
                  {
                      str(p.parent)
                      for p in Path(os.environ["CARGO_TARGET_DIR"]).rglob(
                          "msquic.dll"
                      )
                  }
              )
              os.environ["PATH"] = os.pathsep.join(
                  [*directories, os.environ["PATH"]]
              )
          subprocess.run(
              [
                  "cargo",
                  "test",
                  "--manifest-path",
                  os.environ["TEST_MANIFEST"],
                  "--target",
                  "${{ matrix.target }}",
                  "--locked",
                  "--offline",
                  "--",
                  "--test-threads=1",
              ],
              check=True,
              timeout=120,
          )
  publish:
    if: github.ref_type == 'tag'
    needs: smoke-tests
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
      - name: Verify the publication archive matches the tested crate
        run: |
          cargo package --manifest-path target/package-src/Cargo.toml \
            --locked --no-verify
          cmp dist/*.crate target/package-src/target/package/*.crate
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - name: Publish tested MsQuic crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          cargo publish --manifest-path target/package-src/Cargo.toml
          --locked --no-verify

  verify:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
      - name: Verify crates.io serves the tested archive
        run: |
          version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          registry="https://static.crates.io/crates/msquic-src"
          curl --fail --location --retry 12 --retry-all-errors \
            --retry-delay 10 \
            "$registry/msquic-src-$version.crate" \
            --output target/registry.crate
          cmp dist/*.crate target/registry.crate
