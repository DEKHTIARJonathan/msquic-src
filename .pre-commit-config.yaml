---
minimum_prek_version: "0.2.0"
exclude: "^msquic/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # -------------------------
  # Markdown formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # -------------------------
  # Script formatting
  # -------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # -------------------------
  # Security/License Check
  # -------------------------
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args: [--all-features, check]
        always_run: true

  - repo: local
    hooks:
      - id: cargo-audit
        name: Check Rust dependencies for vulnerabilities
        entry: cargo audit
        language: system
        files: Cargo\.lock
        pass_filenames: false

  # -------------------------
  # Unused Dependency Check
  # -------------------------
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        # The root manifest mirrors upstream; scan its actual Rust sources.
        # Without --with-metadata this is read-only, including build.rs usage.
        args: [./msquic/Cargo.toml, ./testcrate/Cargo.toml]
